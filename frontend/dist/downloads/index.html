<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>RTBO Advertising Video Download</title>
    <style>
      :root {
        color-scheme: dark;

          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #080808;
        color: #f7f7f7;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(120deg, rgba(255, 106, 0, 0.18), transparent 36%),
          radial-gradient(circle at 72% 18%, rgba(255, 255, 255, 0.1), transparent 28%),

      main {

        padding: 34px;

        border-radius: 8px;
        background: rgba(16, 16, 16, 0.92);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 5vw, 46px);
        line-height: 1;
      }

      p {
        margin: 0 0 24px;
        color: #d4d4d4;
        line-height: 1.55;
        font-size: 17px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 7px;
        color: #111;
        background: #ff6a00;
        font-weight: 800;
        text-decoration: none;
      }

      a.secondary {
        color: #f7f7f7;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.28);
      }

      small {
        display: block;
        margin-top: 18px;
        color: #a8a8a8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>RTBO Advertising Video</h1>
      <p>
        Download the ZIP package or the direct MP4 file for posting on social
        media.
      </p>
      <div class="actions">
        <a
          href="./Raising-The-Bar-Officiating-Advertising-Video.zip"
          download="Raising-The-Bar-Officiating-Advertising-Video.zip"
        >
          Download ZIP
        </a>
        <a
          class="secondary"
          href="./Raising-The-Bar-Officiating-Advertising-Video.mp4"
          download="Raising-The-Bar-Officiating-Advertising-Video.mp4"
